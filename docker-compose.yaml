services:
  vueapp:
    container_name: alorferi_web_app_svc
    build:
      context: .
      dockerfile: infra/dev/node/Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - .:/app
      - vueapp_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development

    networks:
      alorferiwebapp_default:
        ipv4_address: 172.18.0.2

networks:
  alorferiwebapp_default:
    external: true

volumes:
  vueapp_node_modules:
